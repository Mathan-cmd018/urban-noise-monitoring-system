version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: urban_noise_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: urban_noise_db
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: urban_noise_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban_noise_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/urban_noise_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_noise_monitor_2026_secure
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      SIMULATION_INTERVAL_MS: 5000
      SIMULATION_ENABLED: "true"
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urban_noise_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
